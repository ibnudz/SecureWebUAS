<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [require('flowbite/plugin')],
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <form id="signin-form" action="http://localhost:3000/signin" method="POST" class="space-y-6">
            <input type="hidden" id="csrf-signin-token" name="_csrf" value="">
            <h1 class="text-2xl font-semibold text-gray-700 text-center">Sign In</h1>

            <div>
                <label for="signin-email" class="block text-sm font-medium text-gray-600">Email:</label>
                <input 
                    type="email" 
                    id="signin-email" 
                    name="email" 
                    required 
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-700"
                >
            </div>

            <div>
                <label for="signin-password" class="block text-sm font-medium text-gray-600">Password:</label>
                <input 
                    type="password" 
                    id="signin-password" 
                    name="password" 
                    required 
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-700"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-500 text-white py-2 rounded-lg font-medium hover:bg-blue-600 transition duration-200"
            >
                Sign In
            </button>

            <p class="text-sm text-center text-gray-600">
                Belum ada akun? <a href="signup.html" class="text-blue-500 hover:underline">Sign Up</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('http://localhost:3000/csrf-token', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    const csrfTokenField = document.getElementById('csrf-signin-token');
                    csrfTokenField.value = data.csrfToken;
                })
                .catch(error => console.error('Error fetching CSRF token:', error));
        });
    </script>
</body>
</html>
