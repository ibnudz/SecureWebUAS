<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [require('flowbite/plugin')],
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="https://flowbite.com/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="https://flowbite.com/docs/images/logo.svg" class="h-8" alt="Flowbite Logo" />
                <span class="self-center text-2xl font-bold whitespace-nowrap">Pejuang Shop</span>
            </a>
            <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button data-collapse-toggle="navbar-user" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" aria-controls="navbar-user" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
            </div>
            <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-user">
                <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white">
                    <li>
                        <a href="member.html" class="block py-2 px-3 text-white bg-blue-700 rounded md:bg-transparent md:text-blue-700 md:p-0" aria-current="page">Home</a>
                    </li>
                    <li>
                        <a href="transaksi.html" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">Transactions</a>
                    </li>
                    <li>
                        <a href="products.html" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">Product</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="p-4 bg-white block sm:flex items-center justify-between border-b border-gray-200 lg:mt-1.5">
        <div class="w-full mb-1">
            <div class="mb-4">
                <nav class="flex mb-5" aria-label="Breadcrumb">
                    <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
                        <li class="inline-flex items-center">
                            <a href="#" class="inline-flex items-center text-gray-700 hover:text-blue-600">
                                <svg class="w-5 h-5 mr-2.5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                                </svg>
                                Home
                            </a>
                        </li>
                        <li>
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                                </svg>
                                <a href="#" class="ml-1 text-gray-700 hover:text-blue-600 md:ml-2">E-commerce</a>
                            </div>
                        </li>
                        <li>
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                                </svg>
                                <span class="ml-1 text-gray-400 md:ml-2" aria-current="page">Products</span>
                            </div>
                        </li>
                    </ol>
                </nav>
                <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl">All products</h1>
            </div>
            <div class="items-center justify-between block sm:flex md:divide-x md:divide-gray-100">
                <div class="flex items-center mb-4 sm:mb-0">
                    <form class="sm:pr-3" action="#" method="GET">
                        <label for="products-search" class="sr-only">Search</label>
                        <div class="relative w-48 mt-1 sm:w-64 xl:w-96">
                            <input type="text" name="email" id="products-search" class="bg-gray-100 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Search for products">
                        </div>
                    </form>
                </div>
                <button id="createProductButton" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5" type="button" data-drawer-target="drawer-create-product-default" data-drawer-show="drawer-create-product-default" aria-controls="drawer-create-product-default" data-drawer-placement="right">
                    Add new product
                </button>
            </div>
        </div>
    </div>

    <div class="flex flex-col">
        <div class="overflow-x-auto">
            <div class="inline-block min-w-full align-middle">
                <div class="overflow-hidden shadow">
                    <table class="min-w-full divide-y divide-gray-200 table-fixed">
                        <thead class="bg-gray-100">
                            <tr>
                                <th scope="col" class="p-4 text-xs font-bold text-left text-gray-500 uppercase">No</th>
                                <th scope="col" class="p-4 text-xs font-bold text-left text-gray-500 uppercase">Product Name</th>
                                <th scope="col" class="p-4 text-xs font-bold text-left text-gray-500 uppercase">Description</th>
                                <th scope="col" class="p-4 text-xs font-bold text-left text-gray-500 uppercase">Price</th>
                                <th scope="col" class="p-4 text-xs font-bold text-left text-gray-500 uppercase">Photo</th>
                                <th scope="col" class="p-4 text-xs font-bold text-left text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-list" class="bg-white divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="drawer-create-product-default" class="fixed top-0 right-0 z-40 w-full h-screen max-w-xs p-4 overflow-y-auto transition-transform translate-x-full bg-white" tabindex="-1" aria-labelledby="drawer-label" aria-hidden="true">
        <h5 id="drawer-label" class="inline-flex items-center mb-6 text-sm font-semibold text-gray-500 uppercase">New Product</h5>
        <button type="button" data-drawer-dismiss="drawer-create-product-default" aria-controls="drawer-create-product-default" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 absolute top-2.5 right-2.5 inline-flex items-center">
            <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
            <span class="sr-only">Close menu</span>
        </button>
        <form id="product-form" enctype="multipart/form-data">
            <input type="hidden" id="csrf-register-token" name="_csrf" value="">

            <div class="space-y-4">
                <div>
                    <label for="nama" class="block mb-2 text-sm font-medium text-gray-900">Product Name</label>
                    <input type="text" name="nama" id="nama" class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5" placeholder="Enter product name" required>
                </div>

                <div>
                    <label for="deskripsi" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
                    <textarea id="deskripsi" name="deskripsi" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter event description here"></textarea>
                </div>

                <div>
                    <label for="harga" class="block mb-2 text-sm font-medium text-gray-900">Price</label>
                    <input type="number" name="harga" id="harga" class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5" placeholder="Enter price" min="0" required>
                </div>

                <div>
                    <label for="photo" class="block mb-2 text-sm font-medium text-gray-900">Upload Photo</label>
                    <input type="file" name="photo" id="photo" accept="image/*" onchange="previewImage(event)" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50" required>
                    <!-- <img id="photo-preview" class="hidden mt-4 w-full rounded-lg" alt="Photo preview"> -->
                </div>

                <div class="bottom-0 left-0 flex justify-center w-full pb-4 space-x-4 md:px-4 md:absolute">
                    <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Add Product</button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script>
        fetch('http://localhost:3000/api/get-user-id', {
            method: 'GET',
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Unauthorized access');
                }
                return response.json();
            })
            .catch(error => {
                console.error('Error fetching user ID:', error);
                alert('Please log in first!');
                window.location.href = "http://localhost:5500/";
            });

        document.getElementById('product-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch('http://localhost:3000/add-product', {
                method: 'POST',
                body: formData,
                credentials: 'include'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message === 'Product added successfully') {
                        alert('Produk berhasil ditambahkan!');
                        window.location.href = 'products.html';
                    } else {
                        alert(`Error: ${data.message}`);
                    }
                })
                .catch(error => {
                    console.error('Terjadi kesalahan saat mengirim data:', error);
                    alert('Terjadi kesalahan saat mengirim data!');
                });
        });

        document.addEventListener('DOMContentLoaded', function () {
            fetch('http://localhost:3000/csrf-token', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('csrf-register-token').value = data.csrfToken;
                })
                .catch(error => console.error('Error fetching CSRF token:', error));

            fetch('http://localhost:3000/list-products-self', { credentials: 'include' })
                .then(response => response.json())
                .then(products => {
                    const productList = document.getElementById('product-list');
                    productList.innerHTML = '';
                    products.forEach((product, index) => {
                        const photo = product.photo || 'https://via.placeholder.com/150';
                        const row = `
                            <tr>
                                <td class="p-2 border border-gray-300">${index + 1}</td>
                                <td class="p-2 border border-gray-300">${product.nama}</td>
                                <td class="p-2 border border-gray-300">${product.deskripsi}</td>
                                <td class="p-2 border border-gray-300">Rp ${parseInt(product.harga).toLocaleString('id-ID')}</td>
                                <td class="p-2 border border-gray-300">
                                    <img src="${photo}" alt="Product Photo" class="w-20 h-20 object-cover rounded-lg">
                                </td>
                                <td class="p-2 border border-gray-300">
                                    <button class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition btn-edit" data-id="${product.id}">Edit</button>
                                    <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition btn-delete" data-id="${product.id}">Delete</button>
                                </td>
                            </tr>
                        `;
                        productList.innerHTML += row;
                    });

                    document.querySelectorAll('.btn-edit').forEach(button => {
                        button.addEventListener('click', function () {
                            const productId = this.getAttribute('data-id');
                            window.location.href = `edit-product.html?id=${productId}`;
                        });
                    });

                    document.querySelectorAll('.btn-delete').forEach(button => {
                        button.addEventListener('click', function () {
                            const productId = this.getAttribute('data-id');
                            if (confirm('Are you sure you want to delete this product?')) {
                                fetch(`http://localhost:3000/delete-product/${productId}`, {
                                    method: 'DELETE',
                                    credentials: 'include'
                                })
                                    .then(response => response.json())
                                    .then(result => {
                                        alert('Product successfully deleted!');
                                        window.location.reload();
                                    })
                                    .catch(error => console.error('Error deleting product:', error));
                            }
                        });
                    });
                })
                .catch(error => console.error('Error fetching product list:', error));
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('photo-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('photo-preview').classList.add('hidden');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('photo-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('photo-preview').classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            fetch('http://localhost:3000/list-products-self', { credentials: 'include' })
                .then(response => response.json())
                .then(products => {
                    const productList = document.getElementById('product-list');
                    productList.innerHTML = '';

                    products.forEach((product, index) => {
                        const photo = product.photo || 'https://via.placeholder.com/150';

                        const row = `
                    <tr>
                        <td class="border px-4 py-2">${index + 1}</td>
                        <td class="border px-4 py-2">${product.nama}</td>
                        <td class="border px-4 py-2">${product.deskripsi}</td>
                        <td class="border px-4 py-2">Rp ${parseInt(product.harga).toLocaleString('id-ID')}</td>
                        <td class="border px-4 py-2">
                            <img src="${photo}" alt="Product Photo" class="w-24 h-24 object-cover rounded">
                        </td>
                        <td class="border px-4 py-2">
                            <button class="bg-blue-500 text-white px-4 py-2 rounded mr-2 btn-edit" data-id="${product.id}">Edit</button>
                            <button class="bg-red-500 text-white px-4 py-2 rounded btn-delete" data-id="${product.id}" data-nama="${product.nama}">Hapus</button>
                        </td>
                    </tr>
                `;
                        productList.innerHTML += row;
                    });

                    document.querySelectorAll('.btn-delete').forEach(button => {
                        button.addEventListener('click', function () {
                            const productId = this.getAttribute('data-id');
                            const productName = this.getAttribute('data-nama');
                            if (confirm(`Apakah Anda yakin ingin menghapus produk "${productName}"?`)) {
                                fetch(`http://localhost:3000/delete-product/${productId}`, {
                                    method: 'DELETE',
                                    credentials: 'include'
                                })
                                    .then(response => response.json())
                                    .then(() => {
                                        alert(`Produk "${productName}" berhasil dihapus!`);
                                        window.location.reload();
                                    })
                                    .catch(error => console.error('Error deleting product:', error));
                            }
                        });
                    });
                })
                .catch(error => console.error('Error fetching product list:', error));
        });

        function logout() {
            fetch('http://localhost:3000/logout', {
                method: 'GET',
                credentials: 'include'
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    window.location.href = "http://localhost:5500/";
                })
                .catch(error => console.error('Error during logout:', error));
        }
    </script>
</body>

</html>
