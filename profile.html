<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [require('flowbite/plugin')],
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">    
    <style>
        body {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body class="font-sans bg-gray-100">
   
    <!-- Navbar -->
    <nav class="bg-white border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="https://flowbite.com/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="https://flowbite.com/docs/images/logo.svg" class="h-8" alt="Flowbite Logo" />
                <span class="self-center text-2xl font-bold whitespace-nowrap">Pejuang Shop</span>
            </a>
            <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button data-collapse-toggle="navbar-user" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" aria-controls="navbar-user" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
            </div>
            <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-user">
                <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white">
                    <li>
                        <a href="member.html" class="block py-2 px-3 text-white bg-blue-700 rounded md:bg-transparent md:text-blue-700 md:p-0" aria-current="page">Home</a>
                    </li>
                    <li>
                        <a href="transaksi.html" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">Transactions</a>
                    </li>
                    <li>
                        <a href="products.html" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">Product</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mx-auto py-8">
        <div class="text-center mb-6">
            <a href="products.html">
                <button type="button" class="px-4 py-2 bg-blue-500 text-white rounded shadow hover:bg-blue-600">Lihat Barang Saya</button>
            </a>
        </div>

        <h1 class="text-center text-2xl font-bold mb-6">Profile Details</h1>

        <div id="profile-details" class="bg-white shadow-md rounded p-6 max-w-xl mx-auto">
            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Email:</div>
                <div class="col-span-2" id="email"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Name:</div>
                <div class="col-span-2" id="name"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Nomor HP:</div>
                <div class="col-span-2" id="nomor_hp"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Alamat Web:</div>
                <div class="col-span-2"><a href="#" id="alamat_web" target="_blank" class="text-blue-500 hover:underline"></a></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Tempat Lahir:</div>
                <div class="col-span-2" id="tempat_lahir"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Tanggal Lahir:</div>
                <div class="col-span-2" id="tanggal_lahir"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">No. KK:</div>
                <div class="col-span-2" id="no_kk"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">No. KTP:</div>
                <div class="col-span-2" id="no_ktp"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="font-semibold">Photo:</div>
                <div class="col-span-2">
                    <img id="photo" class="w-32 h-32 rounded shadow" alt="Profile Photo">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script>
        fetch('http://localhost:3000/api/get-user-id', {
                method: 'GET',
                credentials: 'include' // Include cookies in request
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Unauthorized access');
                }
                return response.json();
            })
            .catch(error => {
                console.error('Error fetching user ID:', error);
                alert('Please log in first!');
                window.location.href = "http://localhost:5500/";
            });

        // Fetch data user dari server dan tampilkan sebagai teks dan gambar
        fetch('http://localhost:3000/api/profile', {
            method: 'GET',
            credentials: 'include'
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('email').innerText = data.email;
            document.getElementById('name').innerText = data.nama;
            document.getElementById('nomor_hp').innerText = data.nomor_hp;
            document.getElementById('alamat_web').innerText = data.alamat_web;
            document.getElementById('alamat_web').href = data.alamat_web;
            document.getElementById('tempat_lahir').innerText = data.tempat_lahir;
            document.getElementById('tanggal_lahir').innerText = new Date(data.tanggal_lahir).toLocaleDateString('id-ID');
            document.getElementById('no_kk').innerText = data.no_kk;
            document.getElementById('no_ktp').innerText = data.no_ktp;
            document.getElementById('photo').src = data.photo || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNNLEL-qmmLeFR1nxJuepFOgPYfnwHR56vcw&s'; // Gunakan gambar default jika photo kosong
        })
        .catch(error => {
            console.error('Error fetching profile data:', error);
            alert('Failed to load profile data');
        });

        function logout() {
            fetch('http://localhost:3000/logout', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.href = "http://localhost:5500/";
            })
            .catch(error => {
                console.error('Error during logout:', error);
            });
        }
    </script>
</body>
</html>
