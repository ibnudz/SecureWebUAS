<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [require('flowbite/plugin')],
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-semibold text-gray-700 text-center mb-6">Sign Up</h1>
        <form id="register-form" action="http://localhost:3000/signup" method="POST" enctype="multipart/form-data" class="space-y-6">
            <input type="hidden" id="csrf-register-token" name="_csrf" value="">

            <div>
                <label for="register-name" class="block text-sm font-medium text-gray-600">Name:</label>
                <input type="text" id="register-name" name="name" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-email" class="block text-sm font-medium text-gray-600">Email:</label>
                <input type="email" id="register-email" name="email" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-password" class="block text-sm font-medium text-gray-600">Password:</label>
                <input type="password" id="register-password" name="password" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-photo" class="block text-sm font-medium text-gray-600">Photo:</label>
                <input type="file" id="register-photo" name="photo" accept="image/*" required class="block w-full text-sm text-gray-500 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                <img id="photo-preview" src="" alt="Photo Preview" class="hidden w-full max-h-48 mt-4 rounded-lg">
            </div>

            <div>
                <label for="register-phone" class="block text-sm font-medium text-gray-600">Phone:</label>
                <input type="text" id="register-phone" name="phone" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-website" class="block text-sm font-medium text-gray-600">Website:</label>
                <input type="url" id="register-website" name="website" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-birthplace" class="block text-sm font-medium text-gray-600">Birthplace:</label>
                <input type="text" id="register-birthplace" name="birthplace" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-birthdate" class="block text-sm font-medium text-gray-600">Birthdate:</label>
                <input type="date" id="register-birthdate" name="birthdate" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-nokk" class="block text-sm font-medium text-gray-600">No KK:</label>
                <input type="text" id="register-nokk" name="nokk" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="register-no_ktp" class="block text-sm font-medium text-gray-600">No KTP:</label>
                <input type="text" id="register-no_ktp" name="no_ktp" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg font-medium hover:bg-blue-600 transition duration-200">Register</button>

            <p class="text-sm text-center text-gray-600">
                Sudah ada akun? <a href="index.html" class="text-blue-500 hover:underline">Sign in</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('http://localhost:3000/csrf-token', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    const csrfRegisterToken = document.getElementById('csrf-register-token');
                    csrfRegisterToken.value = data.csrfToken;
                })
                .catch(error => console.error('Error fetching CSRF token:', error));
        });

        document.getElementById('register-photo').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('photo-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('photo-preview').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
