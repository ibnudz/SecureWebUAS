<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [require('flowbite/plugin')],
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto py-8">
        <!-- Kembali -->
        <a href="/products.html" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            Kembali
        </a>

        <h1 class="text-2xl font-bold text-center mb-6">Edit Product</h1>

        <!-- Form Edit Produk -->
        <form id="edit-product-form" enctype="multipart/form-data" class="bg-white p-6 shadow rounded">
            <input type="hidden" id="csrf-signin-token" name="_csrf" value="">

            <!-- Nama Produk -->
            <div class="mb-4">
                <label for="nama" class="block text-sm font-medium text-gray-700">Nama Produk</label>
                <input type="text" id="nama" name="nama" required 
                       class="mt-1 block w-full border-gray-300 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <!-- Deskripsi -->
            <div class="mb-4">
                <label for="deskripsi" class="block text-sm font-medium text-gray-700">Deskripsi</label>
                <textarea id="deskripsi" name="deskripsi" rows="4" required 
                          class="mt-1 block w-full border-gray-300 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
            </div>

            <!-- Harga -->
            <div class="mb-4">
                <label for="harga" class="block text-sm font-medium text-gray-700">Harga</label>
                <input type="number" id="harga" name="harga" required 
                       class="mt-1 block w-full border-gray-300 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <!-- Foto Produk -->
            <div class="mb-4">
                <label for="photo" class="block text-sm font-medium text-gray-700">Foto Produk</label>
                <div class="mt-2">
                    <img id="product-photo-preview" class="w-48 h-48 object-cover rounded shadow mb-3" src="" alt="Foto Produk">
                </div>
                <input type="file" id="photo" name="photo" 
                       class="block w-full text-sm text-gray-700 border border-gray-300 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-500 file:text-white hover:file:bg-blue-600">
            </div>

            <!-- ID Produk (Hidden) -->
            <input type="hidden" id="product-id" name="id">

            <!-- Submit Button -->
            <button type="button" id="submitBtn" 
                    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded shadow focus:outline-none focus:ring focus:ring-blue-300">
                Simpan Perubahan
            </button>

            <!-- Response Message -->
            <div id="response-message" class="mt-4"></div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script>
        fetch('http://localhost:3000/api/get-user-id', {
            method: 'GET',
            credentials: 'include' // Include cookies in request
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Unauthorized access');
            }
            return response.json();
        })
        .catch(error => {
            console.error('Error fetching user ID:', error);
            alert('Please log in first!');
            window.location.href = "http://localhost:5500/";
        });

        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
    
            // Fetch CSRF token
            fetch('http://localhost:3000/csrf-token', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('csrf-signin-token').value = data.csrfToken;
                })
                .catch(error => console.error('Error fetching CSRF token:', error));
    
            // Fetch existing product data
            fetch(`http://localhost:3000/get-product/${productId}`)
                .then(response => response.json())
                .then(product => {
                    document.getElementById('nama').value = product.nama;
                    document.getElementById('deskripsi').value = product.deskripsi;
                    document.getElementById('harga').value = product.harga;
                    document.getElementById('product-id').value = product.id;
    
                    if (product.photo) {
                        document.getElementById('product-photo-preview').src = `${product.photo}`;
                    } else {
                        document.getElementById('product-photo-preview').src = 'https://via.placeholder.com/150';
                    }
                })
                .catch(error => console.error('Error fetching product data:', error));

            document.getElementById('photo').addEventListener('change', (event) => {
                const file = event.target.files[0];
                const preview = document.getElementById('product-photo-preview');
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    preview.src = '';
                }
            });
    
            document.getElementById('submitBtn').addEventListener('click', async () => {
                const formData = new FormData(document.getElementById('edit-product-form'));
                const responseMessage = document.getElementById('response-message');
                try {
                    const response = await fetch(`http://localhost:3000/edit-product/${productId}`, {
                        method: 'POST',
                        body: formData,
                        credentials: 'include',
                    });

                    if (!response.ok) throw new Error('Failed to update product');
                    const result = await response.json();

                    responseMessage.textContent = 'Produk berhasil diperbarui!';
                    responseMessage.className = 'text-green-500';
                    setTimeout(() => (window.location.href = '/products.html'), 2000);
                } catch (error) {
                    console.error('Error updating product:', error);
                    responseMessage.textContent = 'Error updating product. Please try again.';
                    responseMessage.className = 'text-red-500';
                }
            });
        });
    </script>
</body>
</html>
